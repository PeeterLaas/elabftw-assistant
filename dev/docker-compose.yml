# Disposable local eLabFTW for trying the assistant. Everything lives in tmpfs:
# `docker compose down` throws all data away.
#   docker compose -p elab-assistant -f dev/docker-compose.yml up -d
#   docker exec elab-assistant-web bin/init db:populate /elabftw/src/tools/populate-config.yml.dist -y
# Then open https://localhost:3149 (toto@yopmail.com / totototototo), API key: apiKey4Test
version: "2.4"

services:
  web:
    image: elabftw/elabimg:5.6.15
    container_name: elab-assistant-web
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_NAME=elabftw
      - DB_USER=elabftw
      - DB_PASSWORD=elabftw
      # throwaway key for this local instance only
      - SECRET_KEY=def00000195a92432f2ebb86bf6e9b9646b45ea955cab7b8f2d96ba2259a85c9e09b04647078c425c5392cb631fa3d9816974bbe8e458d61e16f897ef36c0def362458fd
      - SITE_URL=https://localhost:3149
      - SERVER_NAME=localhost
      - DISABLE_HTTPS=false
      - ENABLE_LETSENCRYPT=false
      - GENERATE_TLS_CERT=true
      - PHP_TIMEZONE=Europe/Tallinn
      - TZ=Europe/Tallinn
    ports:
      - "127.0.0.1:3149:443"

  mysql:
    image: mysql:8.4
    environment:
      - MYSQL_ROOT_PASSWORD=elabftw
      - MYSQL_DATABASE=elabftw
      - MYSQL_USER=elabftw
      - MYSQL_PASSWORD=elabftw
      - TZ=Europe/Tallinn
    healthcheck:
      test: "/usr/bin/mysql --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD --execute 'SHOW DATABASES;'"
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/mysql:rw,size=600m
